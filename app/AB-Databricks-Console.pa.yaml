- btnWhoAmI:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="Who am I?"
      X: =52
      Y: =210
      Width: =230
      Height: =60
      Size: =15
      FontWeight: =FontWeight.Semibold
      Fill: =If(varOp = "whoAmI", RGBA(0, 95, 184, 1), RGBA(255, 255, 255, 1))
      Color: =If(varOp = "whoAmI", RGBA(255, 255, 255, 1), RGBA(11, 31, 58, 1))
      HoverFill: =If(varOp = "whoAmI", RGBA(0, 95, 184, 1), RGBA(222, 235, 255, 1))
      HoverColor: =If(varOp = "whoAmI", RGBA(255, 255, 255, 1), RGBA(11, 31, 58, 1))
      PressedFill: =RGBA(0, 95, 184, 1)
      BorderColor: =RGBA(0, 95, 184, 1)
      BorderThickness: =2
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      DisplayMode: =If(varBusy, DisplayMode.Disabled, DisplayMode.Edit)
      OnSelect: |-
        =Set(varBusy, true);
        Set(varOp, "whoAmI");
        Set(varT0, Now());
        Set(
            varResp,
            IfError(
                Environment.ab_DatabricksRequest({Operation: "whoAmI", Payload: ""}),
                {Status: "Error", Result: FirstError.Message}
            )
        );
        Set(varMs, DateDiff(varT0, Now(), TimeUnit.Milliseconds));
        Set(varAt, Now());
        Set(varBusy, false)
