- lblHelp:
    Control: Label@2.5.1
    Properties:
      Text: |-
        =Switch(
            varOp,
            "whoAmI", "Asks Databricks who is calling. The answer is our managed identity: no password or secret anywhere.",
            "dnsCheck", "Looks up the workspace name from inside the delegated subnet. A 10.x address means the private endpoint answers, not the internet.",
            "listClusters", "Lists the compute clusters in the workspace, over the private path.",
            "startCluster", "Starts the demo cluster. It stops by itself after 10 idle minutes to save cost.",
            "submitJob", "Sends a notebook job to Databricks and returns at once with a run id. We never wait inside the plug-in.",
            "runStatus", "Asks for the job state using the run id. When it is done we get the result back.",
            "Every button calls one Dataverse Custom API. The plug-in runs inside our private network and reaches Databricks only through the private endpoint."
        )
      X: =52
      Y: =532
      Width: =480
      Height: =190
      Color: =RGBA(60, 72, 92, 1)
      Size: =13
      VerticalAlign: =VerticalAlign.Top
      Fill: =RGBA(247, 249, 252, 1)
      PaddingLeft: =14
      PaddingTop: =12
      PaddingRight: =14
