# gitleaks: all default rules, plus one allowlisted literal: the public, well known application id of the AzureDatabricks resource (the token scope).
[extend]
useDefault = true

[allowlist]
description = "public AzureDatabricks resource application id, the same for every tenant, not a secret"
regexes = ['''2ff814a6-3304-4ab8-85cb-cd0e6f879c1d''']
